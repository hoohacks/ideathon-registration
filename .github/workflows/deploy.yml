name: Deploy

# Publishing a GitHub Release puts the site live. Pushing to main does not --
# that was the old behaviour, and it meant every merge was a deploy whether or
# not anyone intended one.
#
# `workflow_dispatch` is the emergency handle: it redeploys whatever is on the
# chosen ref without cutting a release, for the day of the event when something
# needs to go out now.
on:
  release:
    types: [published]
  workflow_dispatch:

# Two releases published close together would otherwise race to write gh-pages
# and the loser could be the one that sticks.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the Firebase emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      # A release is not the moment to find out the tests are red.
      - name: Unit tests
        run: npm run test:ci

      - name: Security rules
        run: npm run test:rules

      # Registration is CLOSED unless the repository variable says otherwise, so
      # a deploy that forgets it keeps strangers out rather than letting them
      # in. Flip it in Settings -> Secrets and variables -> Actions -> Variables,
      # then run this workflow again; no code change and no pull request.
      - name: Build
        run: npm run build
        env:
          VITE_REGISTRATION_OPEN: ${{ vars.REGISTRATION_OPEN }}

      - name: Say which way the doors are
        run: |
          if [ "${{ vars.REGISTRATION_OPEN }}" = "true" ]; then
            echo "### Registration is OPEN on this deploy" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Registration is CLOSED on this deploy" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Set the repository variable \`REGISTRATION_OPEN\` to \`true\` and re-run to open it." >> $GITHUB_STEP_SUMMARY
            echo "Sign-in stays open. New judge or organizer accounts: \`#/judge-registration?staff\`." >> $GITHUB_STEP_SUMMARY
          fi

      # The rules go out with every deploy, from the same ref as the site, so
      # the live rules always match the live client. They go first: a rules
      # deploy is the step most likely to fail (credentials, permissions), and
      # failing here ships nothing rather than a site the old rules reject.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy database and storage rules
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::error::The FIREBASE_PROJECT repository variable is not set."
            exit 1
          fi
          npx firebase deploy --only database,storage --project "$PROJECT" --non-interactive

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          commit_message: "Deploy ${{ github.event.release.tag_name || github.sha }}"

      # The dashboard compares config/rulesVersion with REQUIRED_RULES_VERSION,
      # as a number. Last, so if this fails the site and rules are already
      # live and the only effect is the dashboard warning staying up. It must
      # not fail the job either: Discord would announce a live release as one
      # that "did not deploy".
      - name: Record the rules version
        continue-on-error: true
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
          REF: ${{ github.event.release.tag_name || github.sha }}
        run: |
          VERSION=$(grep -oE 'rulesVersion: [0-9]+' database.rules.json | grep -oE '[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "::error::No // rulesVersion: marker in database.rules.json."
            exit 1
          fi
          if ! npx firebase database:set /config/rulesVersion --data "$VERSION" --project "$PROJECT" --force; then
            echo "::warning::Rules and site are live, but config/rulesVersion was not updated. Set it to $VERSION in Control panel, Event setup, Advanced."
            exit 1
          fi

          echo "### Rules deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Rules version: \`$VERSION\`, recorded at \`config/rulesVersion\`" >> $GITHUB_STEP_SUMMARY
          echo "- From: \`$REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`$PROJECT\`" >> $GITHUB_STEP_SUMMARY

  # Tells the team's Discord what happened to a release: live, or failed and
  # why to look. A job of its own, after the deploy, so it can report either
  # outcome -- a step inside the deploy job would never run once a test failed,
  # which is exactly the release people most need to hear about.
  #
  # Runs for releases only: a manual redeploy from the Actions tab is somebody
  # already watching it happen.
  notify:
    name: Tell Discord
    needs: deploy
    if: always() && github.event_name == 'release' && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.deploy.result }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          AUTHOR: ${{ github.event.release.author.login }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTRATION_OPEN: ${{ vars.REGISTRATION_OPEN }}
          SITE_URL: https://hoohacks.github.io/idea-x
        run: |
          # A missing secret should not turn a good deploy red.
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL is not set, so no Discord message was sent."
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            TITLE="${NAME:-$TAG} is live"
            COLOR=1064997      # the success green, #103c25
            STATUS="Deployed"
          else
            TITLE="${NAME:-$TAG} did not deploy"
            COLOR=10357258     # the error oxblood, #9e0a0a
            STATUS="Failed. The site is still on the previous release."
          fi

          if [ "$REGISTRATION_OPEN" = "true" ]; then
            DOORS="Open"
          else
            DOORS="Closed (sign-in stays open; judge accounts at #/judge-registration?staff)"
          fi

          # Discord caps an embed description at 4096 characters; release notes
          # are cut well short of that and point at the full release instead.
          if [ -z "$NOTES" ]; then
            SUMMARY="No release notes."
          elif [ ${#NOTES} -gt 1500 ]; then
            SUMMARY="${NOTES:0:1500}..."
          else
            SUMMARY="$NOTES"
          fi

          # jq builds the JSON, so quotes and newlines in the release notes
          # cannot break the payload.
          jq -n \
            --arg title "$TITLE" \
            --arg url "$RELEASE_URL" \
            --arg summary "$SUMMARY" \
            --arg status "$STATUS" \
            --arg tag "$TAG" \
            --arg author "$AUTHOR" \
            --arg doors "$DOORS" \
            --arg site "$SITE_URL" \
            --arg run "$RUN_URL" \
            --arg prerelease "$PRERELEASE" \
            --argjson color "$COLOR" \
            '{
              username: "Ideathon deploys",
              embeds: [{
                title: $title,
                url: $url,
                description: $summary,
                color: $color,
                fields: ([
                  { name: "Status", value: $status, inline: false },
                  { name: "Version", value: ("`" + $tag + "`" + (if $prerelease == "true" then " (pre-release)" else "" end)), inline: true },
                  { name: "Released by", value: $author, inline: true },
                  { name: "Registration", value: $doors, inline: false },
                  { name: "Links", value: ("[Site](" + $site + ") | [Release](" + $url + ") | [Deploy log](" + $run + ")"), inline: false }
                ]),
                timestamp: (now | todate)
              }]
            }' > payload.json

          # --fail-with-body so a rejected webhook shows Discord's reason in the
          # log rather than a bare exit code
          curl --silent --show-error --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$WEBHOOK"
